<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ftTitle ftDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ftTitle">Fast Track — Sistema de fila de atendimento em Python</title>
  <desc id="ftDesc">Janela de terminal mostrando o menu e a lista de espera do programa Fast Track.</desc>
  <defs>
    <linearGradient id="ftGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="#0d1117"/>
  <rect width="800" height="420" fill="url(#ftGlow)"/>

  <!-- window -->
  <rect x="40" y="40" width="720" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="40" width="720" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="72" width="720" height="10" fill="#161b22"/>
  <circle cx="66" cy="61" r="6" fill="#3a3f4b"/>
  <circle cx="86" cy="61" r="6" fill="#3a3f4b"/>
  <circle cx="106" cy="61" r="6" fill="#3a3f4b"/>
  <text x="400" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">fast_track.py</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c9d1d9">
    <text x="66" y="118" fill="#58a6ff">$ python fast_track.py</text>
    <text x="66" y="146" fill="#58a6ff" font-weight="bold">SISTEMA FASTTRACK</text>
    <text x="66" y="170">1. Novo Chamado</text>
    <text x="66" y="192">2. Atender Próximo</text>
    <text x="66" y="214">3. Listar Fila</text>
    <text x="66" y="236">4. Sair</text>

    <text x="66" y="270">Escolha uma opção: <tspan fill="#79c0ff">3</tspan></text>
    <text x="66" y="298" fill="#58a6ff" font-weight="bold">--- Lista de Espera Atual ---</text>
    <text x="66" y="322">1. [Urgente] Marina Souza - ID: 4821</text>
    <text x="66" y="346">2. [Normal]  Diego Alves  - ID: 7093</text>
  </g>

  <text x="40" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8b949e">Fast Track · Python · Fila de atendimento FIFO</text>
</svg>
