<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1280" height="720" fill="#0f172a"/><rect x="0" y="0" width="14" height="720" fill="#38bdf8"/><text x="70" y="100" font-size="44" font-weight="700" fill="#f1f5f9">Fila FIFO (First In, First Out)</text><rect x="300" y="280" width="200" height="120" rx="14" fill="#f59e0b"/><text x="400" y="350" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Ana</text><rect x="530" y="280" width="200" height="120" rx="14" fill="#38bdf8"/><text x="630" y="350" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Bruno</text><rect x="760" y="280" width="200" height="120" rx="14" fill="#38bdf8"/><text x="860" y="350" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Carla</text><text x="110" y="350" font-size="26" fill="#f1f5f9">pop(0) ←</text><text x="1010" y="350" font-size="26" fill="#f1f5f9">← append()</text><text x="70" y="500" font-size="24" fill="#94a3b8">O primeiro a entrar é o primeiro a ser atendido. Chamados são inseridos no fim da lista</text><text x="70" y="535" font-size="24" fill="#94a3b8">com append() e removidos do início com pop(0).</text></svg>