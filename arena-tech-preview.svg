<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atTitle atDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="atTitle">Arena Tech — Calculadora de custos para eventos de e-sports em C</title>
  <desc id="atDesc">Janela de terminal mostrando a execução do programa Arena Tech, com o relatório de custos do evento.</desc>
  <defs>
    <linearGradient id="atGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="#0d1117"/>
  <rect width="800" height="420" fill="url(#atGlow)"/>

  <!-- window -->
  <rect x="40" y="40" width="720" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="40" width="720" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="72" width="720" height="10" fill="#161b22"/>
  <circle cx="66" cy="61" r="6" fill="#3a3f4b"/>
  <circle cx="86" cy="61" r="6" fill="#3a3f4b"/>
  <circle cx="106" cy="61" r="6" fill="#3a3f4b"/>
  <text x="400" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">arena_tech.c</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c9d1d9">
    <text x="66" y="118" fill="#58a6ff">$ ./arena_tech</text>
    <text x="66" y="146">Quantidade total de participantes: <tspan fill="#79c0ff">32</tspan></text>
    <text x="66" y="170">Quantidade de jogadores por time: <tspan fill="#79c0ff">5</tspan></text>
    <text x="66" y="194">Quantidade de computadores: <tspan fill="#79c0ff">16</tspan></text>
    <text x="66" y="218" fill="#8b949e">...</text>

    <text x="66" y="254" fill="#58a6ff" font-weight="bold">===== Relatorio Arena Tech =====</text>
    <text x="66" y="280">Quantidade de times: 7</text>
    <text x="66" y="304">Consumo estimado de energia: 48.00 kWh</text>
    <text x="66" y="328">Custo total do evento: R$ 883.20</text>
    <text x="66" y="352">Custo medio por participante: R$ 27.60</text>
  </g>

  <text x="40" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8b949e">Arena Tech · C · Cálculo de custos de e-sports</text>
</svg>
