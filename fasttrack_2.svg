<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1280" height="720" fill="#0f172a"/><rect x="0" y="0" width="14" height="720" fill="#38bdf8"/><text x="70" y="100" font-size="44" font-weight="700" fill="#f1f5f9">Menu principal</text><rect x="70" y="150" width="520" height="400" rx="20" fill="#1e293b"/><text x="120" y="205" font-size="28" font-weight="700" fill="#38bdf8">SISTEMA FASTTRACK</text><text x="120" y="250" font-size="32" fill="#f1f5f9"><tspan fill="#38bdf8">1.</tspan> Novo Chamado</text><text x="120" y="320" font-size="32" fill="#f1f5f9"><tspan fill="#38bdf8">2.</tspan> Atender Próximo</text><text x="120" y="390" font-size="32" fill="#f1f5f9"><tspan fill="#38bdf8">3.</tspan> Listar Fila</text><text x="120" y="460" font-size="32" fill="#f1f5f9"><tspan fill="#38bdf8">4.</tspan> Sair</text><rect x="660" y="150" width="550" height="190" rx="16" fill="#1e293b"/><text x="684" y="194" font-size="26" font-weight="700" fill="#f1f5f9">Loop while True</text><text x="684" y="232" font-size="21" fill="#94a3b8">O menu repete até o usuário</text><text x="684" y="262" font-size="21" fill="#94a3b8">escolher a opção 4 (Sair).</text><rect x="660" y="360" width="550" height="190" rx="16" fill="#1e293b"/><text x="684" y="404" font-size="26" font-weight="700" fill="#f1f5f9">Validação</text><text x="684" y="442" font-size="21" fill="#94a3b8">Opção inválida exibe aviso</text><text x="684" y="472" font-size="21" fill="#94a3b8">e o menu é mostrado novamente.</text></svg>