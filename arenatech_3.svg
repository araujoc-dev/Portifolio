<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1280" height="720" fill="#0f172a"/><rect width="14" height="720" fill="#a78bfa"/><text x="70" y="100" font-size="44" font-weight="700" fill="#f1f5f9">Cálculos do sistema</text><rect x="70" y="140" width="550" height="160" rx="16" fill="#1e293b"/><text x="94" y="184" font-size="26" font-weight="700" fill="#f1f5f9">Times</text><text x="94" y="222" font-size="22" font-family="monospace" fill="#94a3b8">ceil(participantes / jogadoresPorTime)</text><rect x="650" y="140" width="550" height="160" rx="16" fill="#1e293b"/><text x="674" y="184" font-size="26" font-weight="700" fill="#f1f5f9">Energia (kWh)</text><text x="674" y="222" font-size="22" font-family="monospace" fill="#94a3b8">(PCs × potência × horas) / 1000</text><rect x="70" y="330" width="550" height="160" rx="16" fill="#1e293b"/><text x="94" y="374" font-size="26" font-weight="700" fill="#f1f5f9">Custo da energia</text><text x="94" y="412" font-size="22" font-family="monospace" fill="#94a3b8">kWh × preço do kWh</text><rect x="650" y="330" width="550" height="160" rx="16" fill="#1e293b"/><text x="674" y="374" font-size="26" font-weight="700" fill="#f1f5f9">Alimentação</text><text x="674" y="412" font-size="22" font-family="monospace" fill="#94a3b8">participantes × preço do kit</text><rect x="70" y="520" width="550" height="160" rx="16" fill="#1e293b"/><text x="94" y="564" font-size="26" font-weight="700" fill="#f1f5f9">Custo total</text><text x="94" y="602" font-size="22" font-family="monospace" fill="#94a3b8">energia + alimentação + outros</text><rect x="650" y="520" width="550" height="160" rx="16" fill="#1e293b"/><text x="674" y="564" font-size="26" font-weight="700" fill="#f1f5f9">Custo médio</text><text x="674" y="602" font-size="22" font-family="monospace" fill="#94a3b8">custo total / participantes</text></svg>