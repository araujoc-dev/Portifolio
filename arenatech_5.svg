<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1280" height="720" fill="#0f172a"/><rect width="14" height="720" fill="#a78bfa"/><text x="70" y="100" font-size="44" font-weight="700" fill="#f1f5f9">Conceitos aplicados em C</text><rect x="70" y="150" width="550" height="200" rx="16" fill="#1e293b"/><text x="94" y="194" font-size="26" font-weight="700" fill="#f1f5f9">Entrada e saída</text><text x="94" y="232" font-size="21" fill="#94a3b8">scanf() e printf()</text><text x="94" y="262" font-size="21" fill="#94a3b8">com %d, %f e %.2f</text><rect x="650" y="150" width="550" height="200" rx="16" fill="#1e293b"/><text x="674" y="194" font-size="26" font-weight="700" fill="#f1f5f9">Tipos de dados</text><text x="674" y="232" font-size="21" fill="#94a3b8">int para contagens,</text><text x="674" y="262" font-size="21" fill="#94a3b8">float para valores</text><rect x="70" y="380" width="550" height="200" rx="16" fill="#1e293b"/><text x="94" y="424" font-size="26" font-weight="700" fill="#f1f5f9">Biblioteca math.h</text><text x="94" y="462" font-size="21" fill="#94a3b8">ceil() arredonda</text><text x="94" y="492" font-size="21" fill="#94a3b8">o número de times para cima</text><rect x="650" y="380" width="550" height="200" rx="16" fill="#1e293b"/><text x="674" y="424" font-size="26" font-weight="700" fill="#f1f5f9">Cast explícito</text><text x="674" y="462" font-size="21" fill="#94a3b8">(float) evita divisão</text><text x="674" y="492" font-size="21" fill="#94a3b8">inteira antes do ceil()</text></svg>